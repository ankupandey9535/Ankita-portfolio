<!DOCTYPE html>
<html lang="en" class="bg-[#0C0C0C]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankita -- Content Management Specialist</title>

  <!-- Google Fonts: Kanit (weights 300 to 900) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* GLOBAL STYLES */
    html, body, #root {
      background-color: #0C0C0C;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
      overflow-x: clip;
      color: #D7E2EA;
    }
    
    *, *::before, *::after {
      box-sizing: border-box;
    }

    .hero-heading {
      background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-[#0C0C0C] text-[#D7E2EA] font-kanit antialiased selection:bg-[#BBCCD7] selection:text-[#0C0C0C]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
